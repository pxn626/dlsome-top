baseURL = "https://dlsome.top/"
languageCode = "zh-cn"
title = "dlsome.top"
theme = "PaperMod"

# Pagination
paginate = 10

# Default content language
defaultContentLanguage = "zh"

# Enable emoji & social icons
enableRobotsTXT = true

[params]
  env = "production"
  description = "AI 和开发者工具集 — 浏览器端免费工具,涵盖 AI prompt 构造器、Claude Skills 模板、YAML/JSON 转换、Token 成本计算等。"
  author = "dlsome.top"
  keywords = [
    "AI 工具",
    "开发者工具",
    "Prompt 构造器",
    "Claude Skills",
    "YAML 转换",
    "JSON 转换",
    "Token 计算",
    "JWT 解析",
    "Cron 解析",
    "TypeScript 类型生成",
  ]
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false
  disableSpecial1stPost = true

  [params.assets]
    favicon = "/favicon.ico"

  [params.profileMode]
    enabled = false

  [params.homeInfoParams]
    Title = "dlsome.top"
    Content = """
    AI 和开发者工具集 · 浏览器端免费 · 零网络上传
    Prompt · Claude Skills · YAML/JSON · JWT · Cron · 全部本地运行
    """

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[permalinks]
  posts = "/:slug/"
  post = "/:slug/"