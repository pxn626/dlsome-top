<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
    <linearGradient id="validGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38a169"/>
      <stop offset="100%" stop-color="#2f855a"/>
    </linearGradient>
    <linearGradient id="errGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#c53030"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Decorative dots pattern (subtle) -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="50" cy="50" r="3"/>
    <circle cx="150" cy="80" r="2"/>
    <circle cx="250" cy="40" r="3"/>
    <circle cx="650" cy="70" r="2"/>
    <circle cx="730" cy="120" r="3"/>
    <circle cx="80" cy="520" r="2"/>
    <circle cx="700" cy="500" r="3"/>
    <circle cx="400" cy="30" r="2"/>
    <circle cx="50" cy="300" r="2"/>
    <circle cx="750" cy="350" r="2"/>
  </g>

  <!-- Title (large, bold) -->
  <text x="400" y="160" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
    JSON Schema Validator
  </text>

  <!-- Subtitle -->
  <text x="400" y="210" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="22" font-weight="500" fill="#bee3f8" letter-spacing="1">
    Draft 4 / 6 / 7 / 2019-09 / 2020-12
  </text>

  <!-- Center icon group: 3 large shields/circles -->
  <g transform="translate(400, 360)" filter="url(#softShadow)">
    <!-- Left circle: valid (green check) -->
    <circle cx="-140" cy="0" r="62" fill="url(#validGrad)"/>
    <path d="M -172 0 L -154 18 L -108 -22" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Center circle: JSON document (blue/white) -->
    <circle cx="0" cy="0" r="78" fill="#ffffff"/>
    <text x="0" y="-4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#2b6cb0">{ }</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2c5282">SCHEMA</text>

    <!-- Right circle: error (red X) -->
    <circle cx="140" cy="0" r="62" fill="url(#errGrad)"/>
    <path d="M 116 -24 L 164 24 M 164 -24 L 116 24" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Bottom feature row: 4 pills -->
  <g transform="translate(400, 480)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">
    <rect x="-340" y="-18" width="155" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="-262" y="5" text-anchor="middle">5 Draft Versions</text>

    <rect x="-175" y="-18" width="120" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="-115" y="5" text-anchor="middle">zh/EN Errors</text>

    <rect x="-45" y="-18" width="105" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="7" y="5" text-anchor="middle">10+ Presets</text>

    <rect x="70" y="-18" width="115" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="127" y="5" text-anchor="middle">3-Format Export</text>
  </g>

  <!-- Bottom brand -->
  <text x="400" y="558" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="14" font-weight="500" fill="#bee3f8" opacity="0.8">
    dlsome.top · 100% browser-based · 0 network calls
  </text>
</svg>