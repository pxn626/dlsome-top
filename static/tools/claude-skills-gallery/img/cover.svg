    <g id="row1">
      <circle cx="60" cy="60" r="6"/><circle cx="180" cy="60" r="6"/><circle cx="300" cy="60" r="6"/><circle cx="420" cy="60" r="6"/><circle cx="540" cy="60" r="6"/><circle cx="660" cy="60" r="6"/><circle cx="780" cy="60" r="6"/><circle cx="900" cy="60" r="6"/><circle cx="1020" cy="60" r="6"/><circle cx="1140" cy="60" r="6"/>
    </g>
    <g id="row2" transform="translate(0,30)">
      <circle cx="60" cy="60" r="6"/><circle cx="180" cy="60" r="6"/><circle cx="300" cy="60" r="6"/><circle cx="420" cy="60" r="6"/><circle cx="540" cy="60" r="6"/><circle cx="660" cy="60" r="6"/><circle cx="780" cy="60" r="6"/><circle cx="900" cy="60" r="6"/><circle cx="1020" cy="60" r="6"/><circle cx="1140" cy="60" r="6"/>
    </g>
    <g id="row3" transform="translate(0,60)">
      <circle cx="60" cy="60" r="6"/><circle cx="180" cy="60" r="6"/><circle cx="300" cy="60" r="6"/><circle cx="420" cy="60" r="6"/><circle cx="540" cy="60" r="6"/><circle cx="660" cy="60" r="6"/><circle cx="780" cy="60" r="6"/><circle cx="900" cy="60" r="6"/><circle cx="1020" cy="60" r="6"/><circle cx="1140" cy="60" r="6"/>
    </g>
    <g id="row4" transform="translate(0,90)">
      <circle cx="60" cy="60" r="6"/><circle cx="180" cy="60" r="6"/><circle cx="300" cy="60" r="6"/><circle cx="420" cy="60" r="6"/><circle cx="540" cy="60" r="6"/><circle cx="660" cy="60" r="6"/><circle cx="780" cy="60" r="6"/><circle cx="900" cy="60" r="6"/><circle cx="1020" cy="60" r="6"/><circle cx="1140" cy="60" r="6"/>
    </g>
    <g id="row5" transform="translate(0,120)">
      <circle cx="60" cy="60" r="6"/><circle cx="180" cy="60" r="6"/><circle cx="300" cy="60" r="6"/><circle cx="420" cy="60" r="6"/><circle cx="540" cy="60" r="6"/><circle cx="660" cy="60" r="6"/><circle cx="780" cy="60" r="6"/><circle cx="900" cy="60" r="6"/><circle cx="1020" cy="60" r="6"/><circle cx="1140" cy="60" r="6"/>
    </g>
  </g>

  <!-- Big "CSG" letterform -->
  <text x="60" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="240" font-weight="900" fill="url(#accent)" letter-spacing="-8">CSG</text>

  <!-- Title -->
  <text x="60" y="450" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="700" fill="#f1f5f9">Claude Skills Template Gallery</text>

  <!-- Subtitle -->
  <text x="60" y="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">50+ Skills · 5 Categories · Anthropic Skills v1.0</text>

