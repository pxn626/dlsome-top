  <text x="60" y="555" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">Browse · Preview · Copy · Compose</text>

  <!-- Site badge -->
