  <text x="150" y="601" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#a5b4fc" text-anchor="middle">dlsome.top</text>

  <!-- Right side: category chips -->
  <g transform="translate(720,140)">
    <g transform="translate(0,0)">
      <rect width="200" height="44" rx="22" fill="#3b82f6"/>
      <text x="100" y="29" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">🔍 Code · 10</text>
    </g>
    <g transform="translate(220,0)">
      <rect width="200" height="44" rx="22" fill="#a855f7"/>
      <text x="100" y="29" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">✍️ Writing · 10</text>
    </g>
    <g transform="translate(0,60)">
      <rect width="200" height="44" rx="22" fill="#10b981"/>
      <text x="100" y="29" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">📊 Data · 10</text>
    </g>
    <g transform="translate(220,60)">
      <rect width="200" height="44" rx="22" fill="#f59e0b"/>
      <text x="100" y="29" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">🔬 SEO · 10</text>
    </g>
    <g transform="translate(110,120)">
      <rect width="200" height="44" rx="22" fill="#ef4444"/>
      <text x="100" y="29" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">📦 General · 10</text>
    </g>
