<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="LLM Token Cost Calculator cover with 13-model comparison table">
  <title>LLM Token Cost Calculator</title>
  <desc>Browser-based LLM API cost calculator comparing 13 models: GPT-4o, Claude Sonnet 4.5, Gemini, DeepSeek, Qwen, GLM, Meta Llama.</desc>

  <defs>
    <linearGradient id="ltceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a2540"/>
    </linearGradient>
    <linearGradient id="ltceAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="ltceShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.3"/>
      <feComposite in2="off" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ltceBg)"/>

  <!-- Top-left brand bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#ltceAccent)"/>

  <!-- Brand wordmark -->
  <g transform="translate(60, 70)">
    <circle cx="14" cy="14" r="14" fill="#1a73e8"/>
    <text x="40" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">dlsome.top</text>
    <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">Free dev tools · No signup</text>
  </g>

  <!-- Big title -->
  <g transform="translate(60, 160)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="800" fill="#ffffff">LLM Token Cost</text>
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="800" fill="#10b981">Calculator</text>
    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">Compare 13 models · USD ⇄ CNY · Monthly cost · Cache ROI</text>
  </g>

  <!-- Mockup card (right side) -->
  <g transform="translate(640, 80)" filter="url(#ltceShadow)">
    <rect x="0" y="0" width="500" height="470" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <!-- Card header -->
    <rect x="0" y="0" width="500" height="44" rx="12" fill="#0f172a"/>
    <rect x="0" y="32" width="500" height="12" fill="#0f172a"/>
    <circle cx="22" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="62" cy="22" r="5" fill="#10b981"/>
    <text x="240" y="28" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#94a3b8">cost comparison</text>

    <!-- Table header -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="460" height="28" rx="4" fill="#1e293b"/>
      <text x="14" y="20" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">MODEL</text>
      <text x="180" y="20" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">INPUT/1M</text>
      <text x="290" y="20" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">OUTPUT/1M</text>
      <text x="400" y="20" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">1K+500</text>
    </g>

    <!-- Model rows -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#e2e8f0">
      <!-- Row 1: cheapest highlight (green) -->
      <rect x="10" y="105" width="480" height="34" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1"/>
      <text x="28" y="127" font-weight="700" fill="#10b981">🏆 DeepSeek V3</text>
      <text x="190" y="127" fill="#cbd5e1">$0.14</text>
      <text x="300" y="127" fill="#cbd5e1">$0.28</text>
      <text x="410" y="127" font-weight="700" fill="#10b981">$0.00028</text>

      <!-- Row 2 -->
      <text x="28" y="167" fill="#cbd5e1">Gemini 2.0 Flash</text>
      <text x="190" y="167" fill="#94a3b8">$0.10</text>
      <text x="300" y="167" fill="#94a3b8">$0.40</text>
      <text x="410" y="167" fill="#e2e8f0">$0.00030</text>
      <line x1="20" y1="180" x2="480" y2="180" stroke="#334155" stroke-width="1"/>

      <!-- Row 3 -->
      <text x="28" y="207" fill="#cbd5e1">GPT-4o mini</text>
      <text x="190" y="207" fill="#94a3b8">$0.15</text>
      <text x="300" y="207" fill="#94a3b8">$0.60</text>
      <text x="410" y="207" fill="#e2e8f0">$0.00045</text>
      <line x1="20" y1="220" x2="480" y2="220" stroke="#334155" stroke-width="1"/>

      <!-- Row 4 -->
      <text x="28" y="247" fill="#cbd5e1">Qwen Turbo</text>
      <text x="190" y="247" fill="#94a3b8">$0.30</text>
      <text x="300" y="247" fill="#94a3b8">$0.60</text>
      <text x="410" y="247" fill="#e2e8f0">$0.00060</text>
      <line x1="20" y1="260" x2="480" y2="260" stroke="#334155" stroke-width="1"/>

      <!-- Row 5 -->
      <text x="28" y="287" fill="#cbd5e1">GPT-4o</text>
      <text x="190" y="287" fill="#94a3b8">$2.50</text>
      <text x="300" y="287" fill="#94a3b8">$10.00</text>
      <text x="410" y="287" fill="#e2e8f0">$0.00750</text>
      <line x1="20" y1="300" x2="480" y2="300" stroke="#334155" stroke-width="1"/>

      <!-- Row 6 -->
      <text x="28" y="327" fill="#cbd5e1">Claude Sonnet 4.5</text>
      <text x="190" y="327" fill="#94a3b8">$3.00</text>
      <text x="300" y="327" fill="#94a3b8">$15.00</text>
      <text x="410" y="327" fill="#e2e8f0">$0.01050</text>
      <line x1="20" y1="340" x2="480" y2="340" stroke="#334155" stroke-width="1"/>

      <!-- Row 7 (red highlight: most expensive in viewport) -->
      <text x="28" y="367" fill="#ef4444" font-weight="700">⚠ Claude Opus 4.1</text>
      <text x="190" y="367" fill="#94a3b8">$15.00</text>
      <text x="300" y="367" fill="#94a3b8">$75.00</text>
      <text x="410" y="367" fill="#ef4444" font-weight="700">$0.05250</text>
    </g>

    <!-- Footer chips -->
    <g transform="translate(20, 405)">
      <rect x="0" y="0" width="86" height="26" rx="13" fill="#1a73e8" fill-opacity="0.2" stroke="#1a73e8" stroke-width="1"/>
      <text x="43" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#60a5fa">13 models</text>

      <rect x="96" y="0" width="100" height="26" rx="13" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
      <text x="146" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#34d399">USD ⇄ CNY</text>

      <rect x="206" y="0" width="118" height="26" rx="13" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
      <text x="265" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">Cache ROI</text>

      <rect x="334" y="0" width="116" height="26" rx="13" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1"/>
      <text x="392" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Zero fetch</text>
    </g>
  </g>

  <!-- Bottom CTA strip -->
  <g transform="translate(60, 560)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#ffffff">🌐 dlsome.top/tools/llm-token-cost-estimator</text>
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">Browser-only · No signup · 13 mainstream LLMs · Last updated 2026-08</text>
  </g>
</svg>
